name: CI & Release Pipeline

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test (Ubuntu 24.04 x86_64)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            libgtkmm-4.0-dev \
            libjsoncpp-dev \
            pkg-config

      - name: Configure CMake (Release)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON

      - name: Build Executables & Libraries
        run: |
          cmake --build build

      - name: Run Catch2 Unit Tests
        run: |
          ctest --test-dir build --output-on-failure

      - name: Stage Installation Files
        run: |
          DESTDIR="${PWD}/staging" cmake --build build --target install

      - name: Package Release Asset
        run: |
          VERSION="${GITHUB_REF_NAME:-v0.1.0}"
          ASSET_NAME="emotion-expressor-${VERSION}-linux-x86_64"
          
          mkdir -p dist/${ASSET_NAME}
          cp -r staging/usr/local/* dist/${ASSET_NAME}/
          
          cd dist
          tar -czvf ${ASSET_NAME}.tar.gz ${ASSET_NAME}
          sha256sum ${ASSET_NAME}.tar.gz > ${ASSET_NAME}.tar.gz.sha256

      - name: Upload Artifacts (Pull Requests & Main)
        uses: actions/upload-artifact@v4
        with:
          name: emotion-expressor-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.sha256

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
