<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
<!--Base Face Spherical Gradient-->
    <radialGradient id="faceBase" cx="50%" cy="38%" r="50%" fx="50%" fy="22%">
      <stop offset="0%" stop-color="#FFF8A6"/>
      <stop offset="42%" stop-color="#FFC81B"/>
      <stop offset="78%" stop-color="#E58300"/>
      <stop offset="100%" stop-color="#B85200"/>
    </radialGradient>
<!--Top Rim Gloss Effect-->
    <linearGradient id="topHighlight" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.0"/>
    </linearGradient>
<!--Deep Eye Color-->
    <linearGradient id="eyeGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#3D1E03"/>
      <stop offset="100%" stop-color="#1F0D00"/>
    </linearGradient>
<!--Soft Eye Catchlight-->
    <radialGradient id="eyeLight" cx="50%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0"/>
    </radialGradient>
<!--Outer Mouth Border Darkening-->
    <linearGradient id="mouthBorder" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#3A1700"/>
      <stop offset="100%" stop-color="#210A00"/>
    </linearGradient>
<!--Mouth Cavity Depth-->
    <linearGradient id="cavityGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#2D1200"/>
      <stop offset="100%" stop-color="#4A1800"/>
    </linearGradient>
<!--Subtle Tooth Gradient for Depth-->
    <linearGradient id="teethGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="80%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2DFD7"/>
    </linearGradient>
<!--Vibrant Tongue Gradient-->
    <linearGradient id="tongueGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FF7690"/>
      <stop offset="100%" stop-color="#EF3B5D"/>
    </linearGradient>
  </defs>
<!--Head Base-->
  <circle cx="256" cy="256" r="240" fill="url(#faceBase)"/>
<!--Top Curved Gloss Overlay-->
  <ellipse cx="256" cy="256" rx="240" ry="240" fill="url(#topHighlight)"/>
<!--Left Eye-->
  <g>
    <ellipse cx="178" cy="188" rx="30" ry="54" fill="url(#eyeGrad)"/>
    <ellipse cx="178" cy="164" rx="17" ry="22" fill="url(#eyeLight)"/>
  </g>
<!--Right Eye-->
  <g>
    <ellipse cx="334" cy="188" rx="30" ry="54" fill="url(#eyeGrad)"/>
    <ellipse cx="334" cy="164" rx="17" ry="22" fill="url(#eyeLight)"/>
  </g>
<!--Mouth Group-->
  <g>
<!--Dark Outer Mouth Shell (Stroke/Border Effect)-->
    <path d="M 72,282 C 72,282 152,308 256,308 C 360,308 440,282 440,282 C 452,348 402,442 256,442 C 110,442 60,348 72,282 Z" fill="url(#mouthBorder)"/>
<!--Inner Mouth Cavity-->
    <path d="M 82,290 C 82,290 158,314 256,314 C 354,314 430,290 430,290 C 420,344 378,432 256,432 C 134,432 92,344 82,290 Z" fill="url(#cavityGrad)"/>
<!--Tongue-->
    <path d="M 191,394 C 210,381 232,375 256,375 C 280,375 302,381 321,394 C 306,420 283,432 256,432 C 229,432 206,420 191,394 Z" fill="url(#tongueGrad)"/>
<!--Teeth-->
    <path d="M 82,290 C 130,305 188,314 256,314 C 324,314 382,305 430,290 C 424,316 396,358 350,358 C 292,358 220,358 162,358 C 116,358 88,316 82,290 Z" fill="url(#teethGrad)"/>
  </g>
</svg>
